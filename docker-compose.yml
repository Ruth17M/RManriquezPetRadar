services:
  postgres:
    image: postgis/postgis:15-3.4
    platform: linux/amd64
    container_name: lost_found_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lost_found_pets
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lost_found_redis
    ports:
      - '6379:6379'

volumes:
  postgres_data:
